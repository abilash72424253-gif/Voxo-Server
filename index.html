<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOXO - Voice Chat</title><script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.0/dist/livekit-client.umd.min.js"></script><style>body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:20px}button{background:#ff2d55;color:#fff;border:0;padding:12px 20px;border-radius:20px;margin:5px;font-size:16px}input{padding:10px;border-radius:10px;border:0;width:85%;margin:5px;background:#222;color:#fff}.room{background:#222;padding:15px;border-radius:15px;margin:10px}#users{margin-top:15px}</style></head><body><h1>🎤 VOXO</h1><p>Live Voice Rooms - Free</p><input id="name" placeholder="Un peru..."><br><input id="room" placeholder="Room peru - Tamil Room" value="Tamil Room"><br><input id="key" placeholder="VOXO Key" value="VOXO-KEY-BILGI-001"><br><button onclick="join()">Join Room</button><div id="status" style="margin-top:10px"></div><div id="users"></div><script>let room=null;async function join(){let name=document.getElementById('name').value||'Guest';let roomName=document.getElementById('room').value||'Tamil Room';let key=document.getElementById('key').value;document.getElementById('status').innerText='Connecting...';let r=await fetch('/get-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voxoKey:key,room:roomName,username:name})});let d=await r.json();if(d.error){document.getElementById('status').innerText=d.error;return}room=new LivekitClient.Room();room.on('participantConnected',p=>show());room.on('participantDisconnected',p=>show());await room.connect('wss://voxo-v8gwy8d1.livekit.cloud',d.token);await room.localParticipant.setMicrophoneEnabled(true);document.getElementById('status').innerText='✅ LIVE! Mic ON - Pesalam!';show()}function show(){let h='Room Members:<br>';room.remoteParticipants.forEach(p=>{h+='🎤 '+p.identity+'<br>'});h+='🎤 You (Host)';document.getElementById('users').innerHTML=h}</script></body></html>

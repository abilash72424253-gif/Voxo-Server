<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOXO - Voice Chat</title><style>body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:20px}button{background:#ff2d55;color:#fff;border:0;padding:12px 20px;border-radius:20px;margin:5px;font-size:16px}input{padding:10px;border-radius:10px;border:0;width:80%}.room{background:#222;padding:15px;border-radius:15px;margin:10px}</style></head><body><h1>🎤 VOXO</h1><p>Live Voice Rooms</p><input id="name" placeholder="Un peru..."><br><br><input id="room" placeholder="Room peru - Tamil Room"><br><br><button onclick="join()">Join Room</button><div id="rooms"></div><div id="chat" style="display:none"><div class="room"><h3 id="roomName"></h3><button onclick="mic()">🎤 Mic On/Off</button><p id="status">Mic Off</p></div><input id="msg" placeholder="Message..."><button onclick="send()">Send</button><div id="msgs"></div></div><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script>const s=io();let micOn=false;function join(){let n=document.getElementById('name').value||'Guest';let r=document.getElementById('room').value||'Tamil Room';s.emit('join', {name:n,room:r});document.getElementById('roomName').innerText='Room: '+r;document.getElementById('chat').style.display='block'}function mic(){micOn=!micOn;document.getElementById('status').innerText=micOn?'Mic ON - Pesalam!':'Mic Off';navigator.mediaDevices.getUserMedia({audio:true})}function send(){let m=document.getElementById('msg').value;s.emit('chat',m);document.getElementById('msg').value=''}s.on('chat',m=>{let d=document.createElement('div');d.innerText=m;document.getElementById('msgs').appendChild(d)});s.on('user',m=>{let d=document.createElement('div');d.innerText=m;document.getElementById('msgs').appendChild(d)})</script></body></html>

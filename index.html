<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Gift App - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding:15px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px}
.balance{background:#1a1a1a;padding:8px 15px;border-radius:20px;border:1px solid gold;font-weight:bold}
.tabs{display:flex;gap:10px;margin:15px 0}
.tab{padding:8px 16px;background:#222;border-radius:20px;cursor:pointer}
.tab.active{background:gold;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a1a;border-radius:15px;padding:15px;text-align:center;border:2px solid #333}
.card.lucky{border-color:#00ff88}
.card.cp{border-color:#ff69b4}
.card.bellking{border-color:#FFD700;box-shadow:0 0 25px #FFD700;background:linear-gradient(180deg,#1a1a1a,#000)}
.icon{font-size:50px;margin-bottom:8px}
.bellking .icon{animation:bellRing 1s infinite}
@keyframes bellRing{0%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}75%{transform:rotate(-15deg)}}
.name{font-weight:bold;margin:5px 0}
.price{color:gold;margin:5px 0}
.send{width:100%;padding:10px;background:gold;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px}
#popup,#luckyBoxPopup{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;text-align:center}
#giftAnim,#boxIcon{font-size:100px}
#popup h2{margin:15px 0 5px}
#closeText,#boxText{color:#aaa;font-size:14px}
#boxReward{color:gold;font-size:32px;margin-top:10px}
#boxIcon{cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <h2>🎁 Gift Store</h2>
  <div class="balance">🪙 <span id="bal">10,000,000</span></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="filter('all',this)">All</div>
  <div class="tab" onclick="filter('gift',this)">Gift</div>
  <div class="tab" onclick="filter('lucky',this)">Lucky</div>
  <div class="tab" onclick="filter('cp',this)">CP</div>
</div>

<div class="grid" id="grid"></div>

<!-- Normal / CP Popup -->
<div id="popup" onclick="closePopup()">
  <div id="giftAnim">🎁</div>
  <h2 id="popupTitle">Gift Sent!</h2>
  <p id="closeText">Auto closing...</p>
</div>

<!-- Lucky Box Popup -->
<div id="luckyBoxPopup" onclick="openBox()">
  <div id="boxIcon">📦</div>
  <h2 id="boxText">Tap to Open Box!</h2>
  <h1 id="boxReward"></h1>
  <p style="color:#888;margin-top:10px">Lucky Gift = Box Open + Coin!</p>
</div>

<script>
let balance = 10000000; // Test Coin 10M
let audioCtx = null;
let lastGift = null;
let boxOpened = false;

let gifts = [
  {id:'bellking', name:'Lucky Bell King', icon:'🔔', price:10000, cat:'lucky'},
  {id:'clover', name:'Lucky Clover', icon:'🍀', price:999, cat:'lucky'},
  {id:'coinbox', name:'Lucky Coin Box', icon:'📦', price:1999, cat:'lucky'},
  {id:'rose', name:'Rose', icon:'🌹', price:100, cat:'gift'},
  {id:'teddy', name:'Teddy', icon:'🧸', price:500, cat:'gift'},
  {id:'ring', name:'Diamond Ring', icon:'💍', price:5000, cat:'gift'},
  {id:'cpheart', name:'CP Heart', icon:'💑', price:2000, cat:'cp'},
  {id:'cplove', name:'CP Forever', icon:'💖', price:8888, cat:'cp'},
];

let currentCat = 'all';
function render(){
  let grid = document.getElementById('grid');
  grid.innerHTML = '';
  gifts.filter(g=> currentCat==='all' || g.cat===currentCat).forEach(g=>{
    let div = document.createElement('div');
    div.className = 'card '+g.cat + (g.id==='bellking' ? ' bellking':'');
    div.innerHTML = `<div class="icon">${g.icon}</div><div class="name">${g.name}</div><div class="price">🪙 ${g.price.toLocaleString()}</div><button class="send" onclick="sendGift('${g.id}')">Send</button>`;
    grid.appendChild(div);
  });
}
function filter(cat, el){
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render();
}

// SOUND - Antha Gift-ku Antha Sound
function playSound(cat){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    let o = audioCtx.createOscillator();
    let g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(cat==='lucky'){
      o.type='triangle';
      o.frequency.setValueAtTime(1200, audioCtx.currentTime);
      o.frequency.setValueAtTime(1800, audioCtx.currentTime+0.1);
      o.frequency.setValueAtTime(2400, audioCtx.currentTime+0.2);
    } else if(cat==='cp'){
      o.type='sine';
      o.frequency.setValueAtTime(520, audioCtx.currentTime);
      o.frequency.setValueAtTime(780, audioCtx.currentTime+0.3);
      o.frequency.setValueAtTime(1040, audioCtx.currentTime+0.6);
    } else {
      o.type='sine';
      o.frequency.setValueAtTime(880, audioCtx.currentTime);
      o.frequency.setValueAtTime(1320, audioCtx.currentTime+0.15);
    }
    g.gain.setValueAtTime(0.35, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.6);
    o.start(); o.stop(audioCtx.currentTime+0.7);
  }catch(e){}
}
function playBellSound(){ playSound('lucky'); setTimeout(()=>playSound('lucky'),150); }
function playCoinSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    let o = audioCtx.createOscillator(); let g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type='square'; o.frequency.setValueAtTime(1500, audioCtx.currentTime);
    o.frequency.setValueAtTime(2000, audioCtx.currentTime+0.1);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.4);
    o.start(); o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}

let popupTimer = null;
function sendGift(id){
  let gift = gifts.find(g=>g.id===id);
  if(balance < gift.price){ alert('Coin Podhadhu!'); return; }
  balance -= gift.price;
  document.getElementById('bal').innerText = balance.toLocaleString();
  lastGift = gift;

  if(gift.id==='bellking') playBellSound();
  else playSound(gift.cat);

  if(gift.cat==='lucky'){
    // LUCKY = Box Open!
    openLuckyBox();
  } else {
    // GIFT / CP = Normal Popup
    showNormalPopup(gift);
  }
}

function showNormalPopup(gift){
  let popup = document.getElementById('popup');
  let anim = document.getElementById('giftAnim');
  document.getElementById('popupTitle').innerText = gift.name + ' Sent!';
  anim.innerText = gift.icon;
  popup.style.display = 'flex';
  let closeTime = 5000; // Gift = 5 Sec
  let animName = 'giftPop';
  if(gift.cat==='cp'){ closeTime=10000; animName='cpHeart'; } // CP = 10 Sec
  anim.style.animation = `${animName} 1s infinite`;
  document.getElementById('closeText').innerText = `Auto closing in ${closeTime/1000} sec...`;
  clearTimeout(popupTimer);
  popupTimer = setTimeout(()=>{ closePopup(); }, closeTime);
}
function closePopup(){
  document.getElementById('popup').style.display='none';
  document.getElementById('giftAnim').style.animation='none';
  clearTimeout(popupTimer);
}

// LUCKY BOX LOGIC
function openLuckyBox(){
  boxOpened = false;
  document.getElementById('boxIcon').innerText = '📦';
  document.getElementById('boxIcon').style.animation = 'boxShake 0.5s infinite';
  document.getElementById('boxText').innerText = 'Tap to Open Box!';
  document.getElementById('boxReward').innerText = '';
  document.getElementById('luckyBoxPopup').style.display = 'flex';
}

function openBox(){
  if(boxOpened) return;
  boxOpened = true;
  let reward = 0;
  if(lastGift && lastGift.id==='bellking'){
    reward = Math.floor(Math.random()*20000)+10000; // Bell King: 10,000 - 30,000
  } else {
    reward = Math.floor(Math.random()*5000)+500; // Normal Lucky: 500 - 5500
  }
  document.getElementById('boxIcon').innerText = '🎉';
  document.getElementById('boxIcon').style.animation = 'giftPop 0.5s';
  document.getElementById('boxText').innerText = 'You Won!';
  document.getElementById('boxReward').innerText = `🪙 +${reward.toLocaleString()} Coin!`;
  playCoinSound();
  balance += reward;
  document.getElementById('bal').innerText = balance.toLocaleString();
  // 2 Sec la auto close
  setTimeout(()=>{
    document.getElementById('luckyBoxPopup').style.display='none';
  }, 2000);
}

let style = document.createElement('style');
style.innerHTML = `
@keyframes luckyBounce{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.4) rotate(15deg)}}
@keyframes giftPop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes cpHeart{0%,100%{transform:scale(1)}50%{transform:scale(1.3);filter:drop-shadow(0 0 20px pink)}}
@keyframes boxShake{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
`;
document.head.appendChild(style);
render();
</script>
</body>
</html>
